<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT Club Candidate Checker</title>

    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Fredoka Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --rose: #D8A2A2;
            --pink: #FFDCDC;
            --cream: #FFF9D6;
            --sage: #8EA66B;
            --ink: #443838;
            --muted: #796969;
        }

        body {
            margin: 0;
            background-color: var(--cream);
            color: var(--ink);
            font-family: 'Fredoka', sans-serif;
        }

        /* Main heading */
        .hero {
            background-color: var(--cream);
            color: var(--rose);
            padding: 30px 24px;
            border-bottom: 6px solid var(--sage);
        }

        .hero h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--rose);
            margin-bottom: 8px;
        }

        .hero p {
            color: var(--muted);
            font-size: 1.1rem;
            margin: 0;
        }

        .page-wrap {
            max-width: 700px;
            margin: 24px auto;
            padding: 0 16px;
        }

        /* White cards */
        .panel {
            background-color: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 22px;
            box-shadow: 0 5px 18px rgba(100, 70, 70, 0.08);
        }

        .panel h2 {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--rose);
            margin-bottom: 18px;
        }

        /* Form */
        .form-label {
            font-weight: 500;
        }

        .form-control {
            border: 1px solid var(--rose);
            border-radius: 8px;
            padding: 10px 12px;
            font-family: 'Fredoka', sans-serif;
        }

        .form-control:focus {
            border-color: var(--sage);
            box-shadow: 0 0 0 3px rgba(142, 166, 107, 0.2);
        }

        /* Button */
        .btn-roster {
            width: 100%;
            background-color: var(--rose);
            color: var(--ink);
            border: none;
            border-radius: 8px;
            padding: 11px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .btn-roster:hover {
            background-color: var(--sage);
            color: white;
        }

        /* Result area */
        .result-box {
            background-color: var(--pink);
            border-radius: 10px;
            padding: 18px 20px;
            min-height: 60px;
            font-size: 1.15rem;
            font-weight: 500;
            color: var(--ink);
        }

        /* Mobile layout */
        @media (max-width: 600px) {
            .hero h1 {
                font-size: 2rem;
            }

            .panel {
                padding: 19px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="hero">
        <h1>ICT Club Candidate Checker</h1>
        <p>Enter your name to see if you are on the club list.</p>
    </header>

    <main class="page-wrap">

        <!-- Name Form -->
        <section class="panel">
            <h2>Check your name</h2>

            <form id="candidateForm" onsubmit="return false;">
                <div class="mb-3">
                    <label for="first_name" class="form-label">First Name</label>
                    <input
                        type="text"
                        id="first_name"
                        class="form-control"
                        placeholder="Enter your first name"
                    >
                </div>

                <div class="mb-3">
                    <label for="last_name" class="form-label">Last Name</label>
                    <input
                        type="text"
                        id="last_name"
                        class="form-control"
                        placeholder="Enter your last name"
                    >
                </div>

                <!-- PyScript event: runs candidate_checker() in main.py -->
                <button type="button" py-click="candidate_checker" class="btn btn-roster">
                    Check
                </button>
            </form>
        </section>

        <!-- Result Area -->
        <section class="panel">
            <h2>Result</h2>
            <div class="result-box" id="result"></div>
        </section>

    </main>

    <script type="py" src="./main.py"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
